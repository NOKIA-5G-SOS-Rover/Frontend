name: CI/CD Pipeline (Validate & Docker Publish)

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nokia-5g-sos-rover/rover-frontend

jobs:
  # JOB 1: Mai intai validam codul
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          CI: false

  # JOB 2: Apoi construim imaginea Docker, DOAR daca Job 1 are succes
  build-and-push-docker:
    needs: build-and-validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} 

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # JOB 3: Conectare pe VM și actualizare container de frontend
  deploy-to-vm:
    needs: build-and-push-docker
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to VM via native SSH
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_IP: ${{ secrets.VM_IP }}
          VM_USERNAME: ${{ secrets.VM_USERNAME }}
        run: |
          # 1. Creăm folderul ascuns .ssh și salvăm cheia privată în el
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # 2. Ne conectăm prin SSH omițând prompt-ul de confirmare a amprentei serverului
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa $VM_USERNAME@$VM_IP << 'EOF'
            cd ~/5g-rover
            docker compose pull frontend
            docker compose up -d frontend
            docker image prune -f
          EOF