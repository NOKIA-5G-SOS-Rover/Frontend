name: Docker Build and Publish

on:
  push:
    branches: [ "main" ] # Se va declanșa automat la orice push pe branch-ul main

env:
  REGISTRY: ghcr.io
  # Numele imaginii va fi de forma: owner/rover-frontend
  IMAGE_NAME: ${{ github.repository_owner }}/rover-frontend

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    
    # Acordăm permisiunile necesare pentru a citi codul și a scrie în registry-ul GitHub
    permissions:
      contents: read
      packages: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GITHUB_TOKEN este generat automat de GitHub la fiecare rulare, nu trebuie să setezi tu nimic manual în secrets
          password: ${{ secrets.GITHUB_TOKEN }} 

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Va genera automat tag-uri (ex: :main, :latest) în funcție de branch
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}